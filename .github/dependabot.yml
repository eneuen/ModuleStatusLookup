# Dependabot keeps the build and test tooling safe and current.
#
# - GitHub Actions: version updates once a month, all in one pull request.
# - Composer: security updates only, grouped into one pull request per folder.
#   Version updates are off (open-pull-requests-limit: 0) because these upgrades
#   are deliberate: the PHPStan setup pins the MikoPBX core release the module
#   targets.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: composer
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    groups:
      composer-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: composer
    directory: /tools/phpstan
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    groups:
      phpstan-tools-security:
        applies-to: security-updates
        patterns: ["*"]
